name: tests

# Every push and pull request: formatting, the fast tests, and an install with no extras.
# Every night (and on request): all the tests, the slow ones and the browser ones too.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the version of .pre-commit-config.yaml
      - run: pip install "black==24.8.0" ruff
      - run: black --check src tests
      # the checks that find real mistakes (pyproject.toml, [tool.ruff.lint])
      - run: ruff check src tests

  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm reads the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # the libraries Qt needs to start offscreen
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e ".[test,gui,shiny]" pytest-xdist
      - run: pytest tests -n auto -m "not slow and not browser" -p no:cacheprovider --durations=15

  minimal:
    # helicon must import, and its command line start, with none of the optional packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install .
      - run: python -c "import helicon; print(helicon.__version__)"
      - run: helicon --help
      - run: |
          python - <<'PY'
          import sys
          import helicon
          heavy = [m for m in ("numba", "torch", "napari", "shiny", "PySide6", "h5py") if m in sys.modules]
          assert not heavy, f"import helicon loaded {heavy}"
          PY

  full:
    # the whole suite, nightly or on request
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e ".[test,gui,shiny,gauss]" pytest-xdist
      - run: playwright install --with-deps chromium
      - run: pytest tests -n auto -p no:cacheprovider --durations=30
