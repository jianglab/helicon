name: tests

# Every push and pull request: formatting, the fast tests, and an install with no extras.
# Every night (and on request): all the tests, the slow ones and the browser ones too.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"
  # numba compiles the numerical code on first use, and each test process does it again
  # without a cache; the cache is kept between runs (below), keyed by the code it was made from
  NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commits of the push are looked at, below
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the version of .pre-commit-config.yaml
      - run: pip install "black==24.8.0" ruff
      - run: black --check src tests tools
      # the checks that find real mistakes (pyproject.toml, [tool.ruff.lint])
      - run: ruff check src tests tools
      # what identifies private data (home and cluster folders, job numbers, ...) in the commits
      # of this push or pull request: messages, paths and added lines (tools/check_private_names.py)
      - name: no private data in the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE_REF..$HEAD_SHA"
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          fi
          if [ -n "$range" ]; then python tools/check_private_names.py --range "$range"; else echo "no range to check"; fi

  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm reads the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # the libraries Qt needs to start offscreen
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - uses: actions/cache@v4
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: numba-${{ runner.os }}-
      - run: pip install -e ".[test,gui,shiny,accelerate]"
      - run: pytest tests -n auto -m "not slow and not browser" -p no:cacheprovider --durations=15

  docs:
    # the user documentation builds without a warning (a broken link or picture is an error)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -b html docs docs/_build -W --keep-going

  minimal:
    # helicon must import, and its command line start, with none of the optional packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 3.14 is a declared classifier, so the cheapest job also guards it
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install .
      - run: python -c "import helicon; print(helicon.__version__)"
      - run: helicon --help
      - run: |
          python - <<'PY'
          import sys
          import helicon
          heavy = [m for m in ("numba", "torch", "napari", "shiny", "PySide6", "h5py") if m in sys.modules]
          assert not heavy, f"import helicon loaded {heavy}"
          PY
      # numba, finufft and cryosparc-tools are now optional (helicon[numba],
      # helicon[finufft], helicon[cryosparc]; together, helicon[accelerate]):
      # none is installed here, so this is the one job that actually proves
      # the commands and plugins that do not need one of them still work
      - run: helicon proc3d --help
      - run: helicon images2star --help
      - run: helicon cryosparc --help

  full:
    # the whole suite, nightly or on request
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - uses: actions/cache@v4
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: numba-${{ runner.os }}-
      # the default torch wheel is the CUDA build, which brings several GB of nvidia-* packages and
      # filled the runner's disk ("No space left on device"); the tests need only the CPU build
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[test,gui,shiny,gauss,accelerate]"
      # a build-time tool, not a helicon dependency: tests/test_shinylive_build.py needs its command
      - run: pip install shinylive
      - run: df -h /
      - run: playwright install --with-deps chromium
      - run: pytest tests -n auto -p no:cacheprovider --durations=30
